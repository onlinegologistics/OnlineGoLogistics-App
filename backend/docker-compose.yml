version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onlinego_app_backend
    restart: always
    ports:
      - "5004:5001"
    environment:
      - PORT=5001
    env_file:
      - .env
    networks:
      - onlinego_app_network

networks:
  onlinego_app_network:
    driver: bridge
